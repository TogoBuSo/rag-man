[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-man"
version = "0.1.0"
description = "Context-Enforced Multi-Tenant RAG Pipeline"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6.0",
    "django-ninja>=1.3",
    "pydantic>=2.8",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "celery>=5.4",
    "redis>=5.0",
    "litellm>=1.50",
    "jsonschema>=4.23",
    "boto3>=1.35",
    "django-storages>=1.14",
    "django-encrypted-model-fields>=0.6.5",
    "trafilatura>=1.12",
    "markitdown>=0.0.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_default_fixture_loop_scope = "function"
